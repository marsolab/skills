name: Release Skills

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      plugin_folder:
        description: 'Plugin folder name under plugins/ (e.g., idiomatic-go, copy)'
        required: false
        type: string

jobs:
  detect-changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      plugins: ${{ steps.changes.outputs.plugins }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed plugin folders
        id: changes
        run: |
          # If manual trigger with plugin_folder specified, use that
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.plugin_folder }}" ]; then
            PLUGIN_FOLDER="${{ github.event.inputs.plugin_folder }}"
            SKILL_MD=$(find "plugins/$PLUGIN_FOLDER/skills" -name "SKILL.md" -maxdepth 2 2>/dev/null | head -1)
            if [ -d "plugins/$PLUGIN_FOLDER" ] && [ -n "$SKILL_MD" ]; then
              echo "plugins=$(jq -nc --arg plugin "$PLUGIN_FOLDER" '[{"plugin": $plugin}]')" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Error: Plugin folder 'plugins/$PLUGIN_FOLDER' not found or missing SKILL.md"
              exit 1
            fi
          fi

          # Otherwise, detect changed folders using git diff
          CHANGED_PLUGINS=$(git diff --name-only HEAD~1 HEAD | grep '^plugins/' | cut -d'/' -f2 | sort -u)

          PLUGINS=()
          for folder in $CHANGED_PLUGINS; do
            # Skip hidden folders
            if [[ "$folder" =~ ^\. ]] || [ "$folder" = "" ]; then
              continue
            fi

            # Check if plugin directory has a SKILL.md
            SKILL_MD=$(find "plugins/$folder/skills" -name "SKILL.md" -maxdepth 2 2>/dev/null | head -1)
            if [ -d "plugins/$folder" ] && [ -n "$SKILL_MD" ]; then
              PLUGINS+=("$folder")
            fi
          done

          if [ ${#PLUGINS[@]} -eq 0 ]; then
            echo "No plugin folders with changes detected"
            echo "plugins=[]" >> $GITHUB_OUTPUT
          else
            # Create JSON array for matrix
            PLUGINS_JSON=$(printf '%s\n' "${PLUGINS[@]}" | jq -R . | jq -s . | jq -c 'map({plugin: .})')
            echo "Detected changed plugins: ${PLUGINS[@]}"
            echo "plugins=$PLUGINS_JSON" >> $GITHUB_OUTPUT
          fi

  check-manifests:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Verify manifests are in sync
        run: |
          uv run scripts/sync-manifests.py --check

  release:
    needs: [detect-changes, check-manifests]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: needs.detect-changes.outputs.plugins != '[]'
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect-changes.outputs.plugins) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse version from SKILL.md
        id: version
        run: |
          SKILL_FILE=$(find "plugins/${{ matrix.plugin.plugin }}/skills" -name "SKILL.md" -maxdepth 2 | head -1)

          if [ -z "$SKILL_FILE" ]; then
            echo "Error: SKILL.md not found in plugins/${{ matrix.plugin.plugin }}/"
            exit 1
          fi

          # Extract version from YAML frontmatter: version: 1.0.0
          VERSION=$(grep -E "^version:" "$SKILL_FILE" | head -1 | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

          if [ -z "$VERSION" ]; then
            echo "Error: Could not parse version from $SKILL_FILE"
            echo "Expected format in YAML frontmatter: version: 1.0.0"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Parsed version: $VERSION"

      - name: Create .skill archive
        id: archive
        run: |
          PLUGIN_NAME="${{ matrix.plugin.plugin }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Create archive with plugin name
          ARCHIVE_NAME="${PLUGIN_NAME}.skill"

          # Create zip archive with plugin contents
          cd "plugins/$PLUGIN_NAME"
          zip -r "../../${ARCHIVE_NAME}" . -q
          cd ../..

          echo "archive_path=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "Created archive: ${ARCHIVE_NAME}"

      - name: Check if tag exists
        id: check_tag
        run: |
          PLUGIN_NAME="${{ matrix.plugin.plugin }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${PLUGIN_NAME}-v${VERSION}"

          # Check if tag exists
          git fetch --tags --quiet || true
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist, will create release"
          fi

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ matrix.plugin.plugin }}-v${{ steps.version.outputs.version }}
          name: ${{ matrix.plugin.plugin }} v${{ steps.version.outputs.version }}
          body: |
            Release of ${{ matrix.plugin.plugin }} plugin v${{ steps.version.outputs.version }}

            See SKILL.md in the plugin folder for details.
          files: ${{ steps.archive.outputs.archive_path }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
